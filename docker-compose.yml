version: "3.8"

services:
  app:
    build:
      context: ./app
    container_name: vision_assist_app
    image: visionassist_user-module-app
    volumes:
      - ./app:/workspace
      - logs_storage:/workspace/logs
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OLLAMA_HOST=vision_assist_llm_local
      - POSTGRES_HOST=vision_assist_db
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB}
      - YOLO_MODEL_PATH=${YOLO_MODEL_PATH:-}
      - VISION_MODEL_TYPE=${VISION_MODEL_TYPE:-yolo}
      - VISION_CUSTOM_CLASSES=${VISION_CUSTOM_CLASSES:-}
    secrets:
      - postgres_password
      - qdrant_api_key
    ports:
      - "8501:8501"
    stdin_open: true
    tty: true
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
      qdrant:
        condition: service_healthy
    command: python main.py

  ollama:
    image: ollama/ollama:latest
    container_name: vision_assist_llm_local
    ports:
      - "11434:11434"
    volumes:
      - ollama_storage:/root/.ollama

  postgres:
    image: postgres:16-alpine
    container_name: vision_assist_db
    hostname: vision_assist_db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password
      - POSTGRES_DB=${POSTGRES_DB}
    secrets:
      - postgres_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_storage:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-vision_assist}"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: vision_assist_qdrant
    hostname: qdrant
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - 'export QDRANT__SERVICE__API_KEY="$(cat /run/secrets/qdrant_api_key)"; exec ./entrypoint.sh'
    secrets:
      - qdrant_api_key
    ports:
      - "6333:6333"  # REST API
      - "6334:6334"  # gRPC API
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c '</dev/tcp/localhost/6333' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  ollama_storage:
  postgres_storage:
  qdrant_storage:
  logs_storage:

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  qdrant_api_key:
    file: ./secrets/qdrant_api_key.txt